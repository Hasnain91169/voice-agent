<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img">
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#111614"/>
      <stop offset="1" stop-color="#0d1312"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="560" rx="18" fill="#0b0f0e"/>
  <text x="72" y="58" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="0" text-anchor="start">Full real-time audio architecture</text>
  <text x="74" y="88" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">Audio owns frames.</text>
  <rect x="80" y="110" width="220" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="96" y="138" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Caller</text>
  <text x="96" y="160" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">16 kHz mono, 20 ms frames</text>
  <rect x="360" y="86" width="240" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="376" y="114" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">RxPump</text>
  <text x="376" y="136" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">one task owns recv()</text>
  <rect x="360" y="186" width="240" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="376" y="214" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">FrameChannel</text>
  <text x="376" y="236" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">rechunk 10-&gt;20ms + RMS</text>
  <rect x="680" y="86" width="230" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="696" y="114" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Echo gate + VAD</text>
  <text x="696" y="136" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">utterance capture</text>
  <rect x="680" y="206" width="230" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="696" y="234" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Barge-in detector</text>
  <text x="696" y="256" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">cancel signal</text>
  <rect x="1010" y="86" width="220" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="1026" y="114" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">ASR</text>
  <text x="1026" y="136" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">faster-whisper small.en</text>
  <rect x="1280" y="86" width="250" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="1296" y="114" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Agent</text>
  <text x="1296" y="136" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">LangGraph + tools + retrieval</text>
  <rect x="1010" y="246" width="220" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="1026" y="274" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Clause assembler</text>
  <text x="1026" y="296" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">first natural break</text>
  <rect x="1280" y="246" width="250" height="72" rx="10" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="1296" y="274" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">TTS + playback</text>
  <text x="1296" y="296" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">Piper resident, 20 ms cadence</text>
  <line x1="300" y1="146" x2="360" y2="122" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="480" y1="158" x2="480" y2="186" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="222" x2="680" y2="122" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="222" x2="680" y2="242" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="910" y1="122" x2="1010" y2="122" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="1230" y1="122" x2="1280" y2="122" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="1405" y1="158" x2="1405" y2="246" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="1280" y1="282" x2="1230" y2="282" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="1010" y1="282" x2="910" y2="242" stroke="#26322f" stroke-width="3" stroke-linecap="round"/>
  <rect x="970" y="214" width="595" height="146" rx="14" fill="none" stroke="#34d399" opacity="0.9"/>
  <text x="990" y="382" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Cancel scope: LLM + TTS + playback.</text>
  <text x="990" y="408" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">One barge-in cancels all three.</text>
  <rect x="80" y="405" width="1440" height="84" rx="12" fill="#111614" stroke="#26322f" opacity="1"/>
  <text x="108" y="438" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Implemented transports: browser + loopback</text>
  <text x="108" y="466" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0" text-anchor="start">Unfinished: Vonage telephony, Deepgram adapter, ElevenLabs adapter. German is design-described but absent in current README.</text>
</svg>
