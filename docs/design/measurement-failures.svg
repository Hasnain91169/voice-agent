<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img">
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#111614"/>
      <stop offset="1" stop-color="#0d1312"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="560" rx="18" fill="#0b0f0e"/>
  <text x="72" y="58" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="0" text-anchor="start">Measurement failures worth leading with</text>
  <text x="74" y="90" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">Every item below looked like a working measurement until the harness was tested against reality.</text>
  <rect x="90" y="140" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="108" y="164" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Malformed JSON</text>
  <text x="340" y="164" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">unset verdict fields scored green</text>
  <rect x="800" y="140" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="818" y="164" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">String-overlap grounding</text>
  <text x="1050" y="164" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">speech rounding looked unsupported</text>
  <rect x="90" y="222" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="108" y="246" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Name leak guardrail</text>
  <text x="340" y="246" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">false positive on Severn Valley</text>
  <rect x="800" y="222" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="818" y="246" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Stale retrieval probes</text>
  <text x="1050" y="246" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">reported 0% at every depth</text>
  <rect x="90" y="304" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="108" y="328" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">First-audio bug</text>
  <text x="340" y="328" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">last frame measured as first frame</text>
  <rect x="800" y="304" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="818" y="328" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Barge-in summary</text>
  <text x="1050" y="328" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">injected counted as cancelled</text>
  <rect x="90" y="386" width="650" height="58" rx="9" fill="#16201d" stroke="#26322f" opacity="1"/>
  <text x="108" y="410" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0" text-anchor="start">Prompt-injection harm</text>
  <text x="340" y="410" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">all 212 tests stayed green</text>
  <rect x="90" y="466" width="1370" height="58" rx="12" fill="#111614" stroke="#26322f" opacity="1"/>
  <text x="118" y="502" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="0" text-anchor="start">Design line: the strongest story is not &#x27;we measured it&#x27;; it is &#x27;we found where the measurement lied and fixed the instrument.&#x27;</text>
</svg>
