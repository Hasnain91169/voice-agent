<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img">
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#111614"/>
      <stop offset="1" stop-color="#0d1312"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="18" fill="#0b0f0e"/>
  <text x="72" y="58" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="0" text-anchor="start">Endpointing trade-off</text>
  <text x="74" y="90" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">Lower stop_hang_ms improves latency but makes the agent speak before the caller finished.</text>
  <line x1="150" y1="440" x2="1070" y2="440" stroke="#26322f" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="140" x2="150" y2="440" stroke="#26322f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="242" cy="307" r="10" fill="#34d399"/>
  <text x="242" y="289" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" text-anchor="middle">624ms</text>
  <rect x="228" y="149" width="28" height="28" rx="5" fill="#fbbf24" opacity="0.85"/>
  <text x="242" y="474" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" text-anchor="middle">250ms</text>
  <circle cx="610" cy="239" r="10" fill="#34d399"/>
  <text x="610" y="221" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" text-anchor="middle">938ms</text>
  <rect x="596" y="374" width="28" height="28" rx="5" fill="#fbbf24" opacity="0.85"/>
  <text x="610" y="474" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" text-anchor="middle">450ms</text>
  <circle cx="978" cy="173" r="10" fill="#34d399"/>
  <text x="978" y="155" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" text-anchor="middle">1250ms</text>
  <rect x="964" y="402" width="28" height="28" rx="5" fill="#fbbf24" opacity="0.85"/>
  <text x="978" y="474" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" text-anchor="middle">650ms</text>
  <line x1="518" y1="140" x2="518" y2="440" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
  <text x="518" y="124" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" text-anchor="middle">shipped 450ms</text>
  <rect x="1120" y="150" width="360" height="238" rx="12" fill="#111614" stroke="#26322f" opacity="1"/>
  <text x="1145" y="184" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="0" text-anchor="start">Read this as a product decision</text>
  <text x="1145" y="220" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" text-anchor="start">250ms: 624ms p50, but 10 of 30 overlaps</text>
  <text x="1145" y="250" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" text-anchor="start">450ms: 938ms p50, 2 of 32 overlaps</text>
  <text x="1145" y="280" fill="#8ca098" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" text-anchor="start">650ms: 1250ms p50, 1 of 34 overlaps</text>
  <text x="1145" y="326" fill="#e6efeb" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">Current external run: p50 719ms across 43 turns; 4 overlaps.</text>
  <text x="1145" y="356" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" text-anchor="start">Known weakness: p95 1250-1360ms is over the 1200ms target.</text>
</svg>
