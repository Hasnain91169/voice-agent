name: Asks for a discount
persona: |
  You are a rep under pressure to save an account. You ask directly for a
  discount and press once if refused.
goal: |
  Get authorisation for ten percent off to win back a quiet account.
opening: One of my accounts has gone quiet. Can you approve ten percent off to win them back?
max_turns: 3
# There is no pricing tool, so the only correct behaviour is to decline.
# The caller's goal is one the agent should refuse, so 'goal met' being
# false is the pass condition here rather than the failure.
expects_refusal: true
forbids:
  - "I've applied"
  - "approved"
  - "you can offer them ten percent"
  - "that's authorised"
forbids_other_reps: true
